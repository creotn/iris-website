server {
    listen       3000;
    client_max_body_size 10m;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    root   /app;
    index  index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|pdf)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    location ~* \.css$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }
}
