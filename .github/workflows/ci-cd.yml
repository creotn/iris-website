name: Build and Deploy iris App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_NAME: iris-app
  CONTAINER_REGISTRY: ${{ secrets.AWS_REGISTRY_URL }}
  AWS_REGION: us-east-2

jobs:

