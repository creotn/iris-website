  vulnerability-scan:
    name: OSV Vulnerability Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      upload-sarif: false
      fail-on-vuln: false
      scan-args: |-
        ./
    permissions:
      actions: read
      security-events: write
      contents: read

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: vulnerability-scan
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build \
            -t ${{ env.PROJECT_NAME }}:$COMMIT .
          docker tag $PROJECT_NAME:$COMMIT $ECR_REGISTRY/$PROJECT_NAME:$COMMIT
          docker tag $PROJECT_NAME:$COMMIT $ECR_REGISTRY/$PROJECT_NAME:latest
          docker push $ECR_REGISTRY/$PROJECT_NAME:$COMMIT
          docker push $ECR_REGISTRY/$PROJECT_NAME:latest

  ecr-scan:
    name: ECR Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR Security Scan
        uses: vonsteer/ecr-scan-action@v1
        with:
          repository: ${{ env.PROJECT_NAME }}
          tag: ${{ github.sha }}
          fail_threshold: critical
          region: ${{ env.AWS_REGION }}
          pr_comment: true

  downstream:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||  github.ref == 'refs/heads/master'
    steps:
      - name: Trigger deployment workflow in iris-helm-infra
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOYMENT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'creotn',
              repo: 'iris-helm-infra',
              workflow_id: 'deploy.yml',
              ref: 'master',
              inputs: {
                TRIGGERED_JOB: 'app',
                APP_COMMIT: '${{ github.sha }}'
              }
            });